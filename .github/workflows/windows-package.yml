name: Build ONclasstime Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: ONclasstime-3.1.0-Windows
          path: |
            release/ONclasstime-3.1.0-Setup.exe
            release/SHA256SUMS.txt
